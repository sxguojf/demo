<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three-Tile 示例集合</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 2.5rem; font-weight: 300; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
    p.sub { color: #94a3b8; margin-bottom: 3rem; font-size: 1.1rem; }
    .cards { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2rem;
      width: 320px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover {
      border-color: #38bdf8;
      transform: translateY(-4px);
    }
    .card h2 { font-size: 1.5rem; font-weight: 500; margin-bottom: 0.75rem; }
    .card p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; }
    .card .tag {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Three-Tile</h1>
    <p class="sub">基于 Three.js 的 3D 瓦片地图示例集合</p>
    <div class="cards">
      <a class="card" href="./three-layer-examples/">
        <h2>Three Layer Examples</h2>
        <p>Google Earth 风格交互界面，支持图层切换、地形控制、多种数据源展示。</p>
        <span class="tag">Vue3 + Element Plus</span>
      </a>
    </div>
  </div>
</body>
</html>
